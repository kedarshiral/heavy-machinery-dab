# Initial seed — machine master universe seed
# audit_start -> sim_00_seed -> audit_end
resources:
  jobs:
    initial_seed_job:
      name: "initial_seed_job [${var.env}]"
      parameters:
        - name: job_name
          default: "initial_seed_job_${var.env}"
      tasks:
        - task_key: audit_start
          notebook_task:
            notebook_path: ../helper/audit_start.ipynb
        - task_key: seed_job
          depends_on:
            - task_key: audit_start
          notebook_task:
            notebook_path: ../sim/sim_00_seed.ipynb
        - task_key: audit_end
          depends_on:
            - task_key: seed_job
          notebook_task:
            notebook_path: ../helper/audit_end.ipynb
