# GPS source simulator
# audit_start -> sim_04_gps -> audit_end
resources:
  jobs:
    gps_adapter:
      name: "4_gps_adapter [${var.env}]"
      parameters:
        - name: job_name
          default: "4_gps_adapter_${var.env}"
      tasks:
        - task_key: audit_start
          notebook_task:
            notebook_path: ../helper/audit_start.ipynb
        - task_key: gps_adapter
          depends_on:
            - task_key: audit_start
          notebook_task:
            notebook_path: ../sim/sim_04_gps.ipynb
        - task_key: audit_end
          depends_on:
            - task_key: gps_adapter
          notebook_task:
            notebook_path: ../helper/audit_end.ipynb
