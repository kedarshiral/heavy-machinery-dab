# Telemetry source simulator
# audit_start -> sim_03_telemetry -> audit_end
resources:
  jobs:
    telemetry_adapter:
      name: "3_telemetry_adapter [${var.env}]"
      parameters:
        - name: job_name
          default: "3_telemetry_adapter_${var.env}"
      tasks:
        - task_key: audit_start
          notebook_task:
            notebook_path: ../helper/audit_start.ipynb
        - task_key: telemetry_adapter
          depends_on:
            - task_key: audit_start
          notebook_task:
            notebook_path: ../sim/sim_03_telemetry.ipynb
        - task_key: audit_end
          depends_on:
            - task_key: telemetry_adapter
          notebook_task:
            notebook_path: ../helper/audit_end.ipynb
